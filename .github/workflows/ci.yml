name: CI

on:
    workflow_dispatch:
        inputs:
            full:
                description: 全量同步数据
                type: boolean
                default: false
    schedule:
        - cron: '17 */3 * * *' # 每 3 小时：常规同步外部数据（intervals 每次都全量拉活动，轨迹走增量缓存）
        - cron: '47 4 * * 0' # 每周日 04:47：全量校正（SYNC_FULL=1，含轨迹重新拉取、历史数据修正）
    push:
        branches:
            - main
            - release/garden-safe-20261115

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  # 数据提交前需要 rebase 到最新 main，浅克隆会拿不到足够历史
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'yarn'

            # 恢复 node_modules 缓存
            - name: Cache node modules
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.yarn/cache
                      ~/.npm
                      node_modules
                      **/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock', '**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-

            - name: Install dependencies
              run: |
                  yarn install --frozen-lockfile

            # 定时触发时：同步外部数据到 src/data/*.json（数据无变化则 writeJson 跳过写盘）
            # 注意：intervals 源没有「只拉新增活动」的模式——每次同步都按自然年窗口全量拉活动列表，
            # 只有轨迹（/activity/{id}/map）复用 src/data/activities.json 里已有的 polyline。
            # SYNC_FULL=1 的用途：忽略轨迹缓存全部重拉（每周日的全量校正），同时用于其它源的兜底校正。
            - name: Determine sync mode
              if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.full }}" = "true" ]; then
                      echo "SYNC_FULL=1" >> "$GITHUB_ENV"
                  elif [ "${{ github.event.schedule }}" = "47 4 * * 0" ]; then
                      echo "SYNC_FULL=1" >> "$GITHUB_ENV"
                  else
                      echo "SYNC_FULL=0" >> "$GITHUB_ENV"
                  fi

            - name: Sync data (scheduled)
              if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
              env:
                  CONFIG_FILE: ${{ secrets.CONFIG_FILE }}
                  INTERVALS_ICU_API_KEY: ${{ secrets.INTERVALS_ICU_API_KEY }}
                  INTERVALS_ICU_ATHLETE_ID: ${{ secrets.INTERVALS_ICU_ATHLETE_ID }}
                  NEODB_TOKEN: ${{ secrets.NEODB_TOKEN }}
                  GOTOSOCIAL_URL: ${{ secrets.GOTOSOCIAL_URL }}
                  GOTOSOCIAL_TOKEN: ${{ secrets.GOTOSOCIAL_TOKEN }}
                  GOTOSOCIAL_ACCOUNT_ID: ${{ secrets.GOTOSOCIAL_ACCOUNT_ID }}
                  MAP_KMZ_URL: ${{ secrets.MAP_KMZ_URL }}
                  # modureader 阅读数据（只读 WebDAV；URL 写 WebDAV 根，不带 /modu）
                  MODU_WEBDAV_URL: ${{ secrets.MODU_WEBDAV_URL }}
                  MODU_WEBDAV_USER: ${{ secrets.MODU_WEBDAV_USER }}
                  MODU_WEBDAV_PASS: ${{ secrets.MODU_WEBDAV_PASS }}
                  # Emby 观看记录（只读；地址与用户 Id 也走 Secrets，仓库里不写死内网域名）
                  EMBY_BASE_URL: ${{ secrets.EMBY_BASE_URL }}
                  EMBY_USER_ID: ${{ secrets.EMBY_USER_ID }}
                  EMBY_API_KEY: ${{ secrets.EMBY_API_KEY }}
              run: |
                  echo "$CONFIG_FILE" > ./.env
                  node scripts/sync-data.mjs
                  node scripts/sync-book-covers.mjs
                  echo "changed=$(git status --porcelain src/data/ src/assets/reading-cover/ public/emby-cover/ | wc -l)" >> "$GITHUB_ENV"

            # 数据有变化时提交（用 [skip ci] 防止触发自身 workflow 造成循环）
            # push 触发时 changed 未设置(空)自动跳过；schedule/dispatch 触发且数据有变化时执行
            - name: Commit data changes
              if: ${{ env.changed != '' && env.changed != '0' }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add src/data/ src/assets/reading-cover/ public/emby-cover/
                  git commit -m "chore(data): 定时同步外部数据源 [skip ci]"
                  # 同步期间 main 可能已经合入代码提交；先 rebase 再推，避免 non-fast-forward。
                  # 只重放这条数据提交，不会覆盖远端代码；连续被抢推时最多重试 3 次。
                  pushed=0
                  for attempt in 1 2 3; do
                      git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
                      if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                          pushed=1
                          break
                      fi
                      sleep $((attempt * 3))
                  done
                  if [ "$pushed" != "1" ]; then
                      echo "数据提交连续 3 次推送失败" >&2
                      exit 1
                  fi

            # 恢复增量构建缓存（Astro 7 experimental.incrementalBuild）
            - name: Restore incremental build cache
              uses: actions/cache@v4
              with:
                  path: node_modules/.astro
                  key: astro-incremental-${{ runner.os }}
                  restore-keys: |
                      astro-incremental-${{ runner.os }}-

            # 构建项目（方案 B：完全离线，读取仓库已提交的 src/data/*.json）
            # 客户端地图配置来自仓库 Secret，不能依赖被 .gitignore 忽略的本地 .env。
            - name: Prepare build environment
              env:
                  CONFIG_FILE: ${{ secrets.CONFIG_FILE }}
              run: |
                  echo "$CONFIG_FILE" > ./.env
                  sed -i -e 's/^MAP_KEY=/PUBLIC_MAP_KEY=/' ./.env

            # 只读读取私有笔记；失败时只报阶段，不把仓库日志/笔记路径输出到公开日志。
            # 放在 node_modules 缓存恢复之后，原始 vault 不进入任何缓存或 artifact。
            - name: Fetch and sync garden vault (read-only)
              env:
                  GARDEN_VAULT_TOKEN: ${{ secrets.GARDEN_VAULT_TOKEN }}
              run: |
                  set -euo pipefail
                  umask 077
                  if [ -z "${GARDEN_VAULT_TOKEN:-}" ]; then
                      echo "Missing GARDEN_VAULT_TOKEN; deployment blocked." >&2
                      exit 1
                  fi
                  mkdir -p .garden
                  askpass=$(mktemp "$RUNNER_TEMP/garden-askpass.XXXXXX")
                  trap 'rm -f "$askpass" .garden/vault-fetch.log; rm -rf .garden/vault' EXIT
                  printf '%s\n' '#!/bin/sh' 'case "$1" in' '*Username*) printf "%s\\n" x-access-token ;;' '*) printf "%s\\n" "$GARDEN_VAULT_TOKEN" ;;' 'esac' > "$askpass"
                  chmod 700 "$askpass"
                  export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
                  if ! git -C "$RUNNER_TEMP" -c credential.helper= clone --quiet --depth 1 --single-branch https://github.com/rebron1900/Obsidian.git "$GITHUB_WORKSPACE/.garden/vault" > .garden/vault-fetch.log 2>&1; then
                      echo "Garden vault fetch failed; check read-only token. Deployment blocked." >&2
                      exit 1
                  fi
                  rm -f "$askpass"
                  unset GARDEN_VAULT_TOKEN GIT_ASKPASS GIT_TERMINAL_PROMPT
                  # 克隆用 077，但同步产物要进 public/ 给 nginx 读：回到 022，避免附件变 600/700 后线上 403。
                  umask 022
                  GARDEN_VAULT_DIR=.garden/vault yarn sync:garden

            - name: Check garden before build (fail closed)
              run: yarn check:garden

            - name: Check Astro types
              run: yarn astro check

            - name: Run tests
              run: yarn test

            # 保留原有 cache key 表达式；每次部署构建强制冷启动，防止旧页面/资源残留。
            - name: Clear incremental render cache
              run: rm -rf node_modules/.astro/dist node_modules/.astro/incremental-build.json

            - name: Build Astro project
              run: yarn build

            # 隐私闸门：dist 与 src/data 里出现任何非公开 Memos 内容即失败（阻断部署）
            - name: Check public data (privacy gate)
              run: node scripts/check-public-data.mjs

            # 公开仓库闸门：原始 .db / record-log / modu_sync 绝不进仓库或 dist
            - name: Guard against leaked modureader database
              run: node scripts/check-no-modu-db.mjs

            - name: Check built garden (fail closed)
              run: |
                  test -s dist/garden/index.html
                  yarn check:garden

            # 部署到 VPS
            - name: Deploy to VPS
              if: github.ref == 'refs/heads/main'
              env:
                  VPS_HOST: ${{ secrets.VPS_HOST }}
                  VPS_PORT: ${{ secrets.VPS_PORT }}
                  VPS_USER: ${{ secrets.VPS_USER }}
                  VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
              run: |
                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh
                  echo "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  echo "StrictHostKeyChecking no" >> ~/.ssh/config
                  # 花园附件已在 R2，VPS 只收页面/脚本/样式：
                  # /garden/99-Rsources/Assets/ 整目录排除，既不新传也不删（旧文件留在服务器上继续可访问）。
                  # -c 按内容比较：每次构建都会重写 mtime，只靠 mtime 会误判成「全部有变化」而重传所有页面。
                  rsync -avzc --delete --chmod=D755,F644 --exclude='.prerender/' --exclude='/garden/99-Rsources/Assets/' -e "ssh -p $VPS_PORT" dist/ $VPS_USER@$VPS_HOST:/var/11ty-data
                  # 已排除的附件不会再传输，但之前用 umask 077 传上去的是 600/700，nginx 读不到（403）。
                  # 这里只改权限、不传文件：一次性把服务器上已有的图片恢复成可读。
                  ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "chmod -R a+rX /var/11ty-data/garden/99-Rsources/Assets 2>/dev/null || true"
