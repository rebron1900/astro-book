name: CI

on:
    workflow_dispatch:
    schedule:
        - cron: '17 */3 * * *'  # 每 3 小时：同步外部数据，有变化才构建部署
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'yarn'

            # 恢复 node_modules 缓存
            - name: Cache node modules
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.yarn/cache
                      ~/.npm
                      node_modules
                      **/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock', '**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-

            - name: Install dependencies
              run: |
                  yarn add sharp --ignore-engines
                  yarn install

            # 定时触发时：同步外部数据到 src/data/*.json（数据无变化则 writeJson 跳过写盘）
            - name: Sync data (scheduled)
              if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
              env:
                  CONFIG_FILE: ${{ secrets.CONFIG_FILE }}
              run: |
                  echo "$CONFIG_FILE" > ./.env
                  node scripts/sync-data.mjs
                  echo "changed=$(git status --porcelain src/data/ | wc -l)" >> "$GITHUB_ENV"

            # 数据有变化时提交（用 [skip ci] 防止触发自身 workflow 造成循环）
            # push 触发时 changed 未设置(空)自动跳过；schedule/dispatch 触发且数据有变化时执行
            - name: Commit data changes
              if: ${{ env.changed != '' && env.changed != '0' }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add src/data/
                  git commit -m "chore(data): 定时同步外部数据源 [skip ci]"
                  git push

            # 恢复增量构建缓存（Astro 7 experimental.incrementalBuild）
            - name: Restore incremental build cache
              uses: actions/cache@v4
              with:
                  path: node_modules/.astro
                  key: astro-incremental-${{ runner.os }}
                  restore-keys: |
                      astro-incremental-${{ runner.os }}-

            # 构建项目（方案 B：完全离线，读取仓库已提交的 src/data/*.json）
            # 客户端地图配置来自仓库 Secret，不能依赖被 .gitignore 忽略的本地 .env。
            - name: Prepare build environment
              env:
                  CONFIG_FILE: ${{ secrets.CONFIG_FILE }}
              run: |
                  echo "$CONFIG_FILE" > ./.env
                  sed -i -e 's/^MAP_URL=/PUBLIC_MAP_URL=/' -e 's/^MAP_KEY=/PUBLIC_MAP_KEY=/' ./.env

            - name: Build Astro project
              run: yarn build

            # 部署到 VPS
            - name: Deploy to VPS
              env:
                  VPS_HOST: ${{ secrets.VPS_HOST }}
                  VPS_PORT: ${{ secrets.VPS_PORT }}
                  VPS_USER: ${{ secrets.VPS_USER }}
                  VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
              run: |
                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh
                  echo "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  echo "StrictHostKeyChecking no" >> ~/.ssh/config
                  rsync -avz --delete -e "ssh -p $VPS_PORT" dist/ $VPS_USER@$VPS_HOST:/var/11ty-data
