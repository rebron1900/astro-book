name: Astro-CI

on:
    workflow_dispatch:
    repository_dispatch:
        types:
            - update
    schedule:
        - cron: '0 */3 * * *'
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '18'
                  cache: 'yarn'

            # 0️⃣ 恢复 node_modules 缓存
            - name: Cache node modules
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.yarn/cache
                      ~/.npm
                      node_modules
                      **/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock', '**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-

            # 3️⃣ 安装依赖
            - name: Install dependencies
              run: |
                  yarn add sharp --ignore-engines
                  yarn install

            # 4️⃣ 构建项目（方案 B：完全离线，读取仓库已提交的 src/data/*.json）
            - name: Build Astro project
              run: yarn build

            # 6️⃣ 部署到 VPS
            - name: Deploy to VPS
              env:
                  VPS_HOST: ${{ secrets.VPS_HOST }}
                  VPS_PORT: ${{ secrets.VPS_PORT }}
                  VPS_USER: ${{ secrets.VPS_USER }}
                  VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
              run: |
                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh
                  echo "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  echo "StrictHostKeyChecking no" >> ~/.ssh/config
                  rsync -avz --delete -e "ssh -p $VPS_PORT" dist/ $VPS_USER@$VPS_HOST:/var/11ty-data

            # - name: 安装 edgeone CLI
            #   run: npm install -g edgeone

            # - name: 打包 dist 为 zip
            #   run: |
            #     # 确保 zip 已安装（Ubuntu 自带，如缺失可 apt-get install -y zip）
            #     zip -r dist.zip ./dist

            # - name: 打包并部署到edgeone
