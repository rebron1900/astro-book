name: Sync-Data

on:
    workflow_dispatch:
    schedule:
        - cron: '17 */2 * * *'  # 每 2 小时同步一次

jobs:
    sync:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'yarn'

            - name: Install dependencies
              run: yarn install

            # 写入 .env（含 GHOST/NEODB/FLUX 密钥，用于同步脚本）
            - name: Write .env
              env:
                  CONFIG_FILE: ${{ secrets.CONFIG_FILE }}
              run: echo "$CONFIG_FILE" > ./.env

            # 同步各数据源到 src/data/*.json（内容无变化则跳过写盘）
            - name: Sync data
              run: node scripts/sync-data.mjs

            # 若有变化则提交 JSON
            - name: Commit data changes
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add src/data/
                  if git diff --cached --quiet; then
                      echo "无数据变化"
                  else
                      git commit -m "chore(data): 定时同步外部数据源"
                      git push
                  fi
